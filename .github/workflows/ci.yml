name: CI

on:
  push:
    branches:
      - main
      - "qualification/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: "18"
          - os: ubuntu-22.04
            node: "20"
          - os: ubuntu-22.04
            node: "22"
          - os: windows-2022
            node: "18"
          - os: windows-2022
            node: "20"
          - os: windows-2022
            node: "22"
          - os: macos-15
            node: "20"
    defaults:
      run:
        working-directory: plugins/freshread
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
        env:
          NO_COLOR: "1"

  release-contract:
    name: Release contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Validate marketplace, manifest, README, and links
        run: node tools/validate-release.mjs --plugin-root plugins/freshread --marketplace .agents/plugins/marketplace.json
      - name: Build deterministic release ZIP smoke artifact
        run: node tools/package-release.mjs --plugin-root plugins/freshread --marketplace .agents/plugins/marketplace.json --smoke --out-dir "$RUNNER_TEMP/freshread-release"
      - name: Validate release ZIP root structure
        run: node tools/validate-release.mjs --plugin-root plugins/freshread --marketplace .agents/plugins/marketplace.json --allow-unqualified --zip-dir "$RUNNER_TEMP/freshread-release"

  deterministic-benchmark:
    name: Deterministic benchmark
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/freshread
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Run full benchmark without rewriting checked-in evidence
        run: node benchmarks/run-benchmark.cjs --out "$RUNNER_TEMP/freshread-benchmark/latest.json"
        env:
          CI: "true"
          NO_COLOR: "1"
      - name: Upload deterministic benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freshread-deterministic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/freshread-benchmark/latest.json
            ${{ runner.temp }}/freshread-benchmark/latest.md
            ${{ runner.temp }}/freshread-benchmark/coverage.json
          if-no-files-found: error
          retention-days: 14
