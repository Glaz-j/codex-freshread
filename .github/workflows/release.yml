name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to validate and publish"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  check-and-test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: "18"
          - os: ubuntu-22.04
            node: "20"
          - os: ubuntu-22.04
            node: "22"
          - os: windows-2022
            node: "18"
          - os: windows-2022
            node: "20"
          - os: windows-2022
            node: "22"
          - os: macos-15
            node: "20"
    defaults:
      run:
        working-directory: plugins/freshread
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
        env:
          NO_COLOR: "1"

  release-contract:
    name: Release contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Validate marketplace, manifest, README, and links
        run: node tools/validate-release.mjs --plugin-root plugins/freshread --marketplace .agents/plugins/marketplace.json --require-release-evidence

  deterministic-benchmark:
    name: Deterministic benchmark
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/freshread
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Run full benchmark without rewriting checked-in evidence
        run: node benchmarks/run-benchmark.cjs --no-write-results
        env:
          CI: "true"
          NO_COLOR: "1"

  package:
    name: Package release assets
    needs:
      - check-and-test
      - release-contract
      - deterministic-benchmark
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Capture reproducible release identity
        run: |
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build release ZIP, checksums, and manifest
        run: node tools/package-release.mjs --plugin-root plugins/freshread --marketplace .agents/plugins/marketplace.json --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --out-dir dist
      - name: Validate final release ZIP
        run: node tools/validate-release.mjs --plugin-root plugins/freshread --marketplace .agents/plugins/marketplace.json --zip "dist/freshread-$RELEASE_TAG.zip"
      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freshread-${{ env.RELEASE_TAG }}-release-assets
          path: |
            dist/freshread-${{ env.RELEASE_TAG }}.zip
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs:
      - package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freshread-${{ env.RELEASE_TAG }}-release-assets
          path: dist
      - name: Revalidate downloaded release assets
        run: node tools/validate-release.mjs --plugin-root plugins/freshread --marketplace .agents/plugins/marketplace.json --require-release-evidence --zip "dist/freshread-$RELEASE_TAG.zip"
      - name: Create release or refresh its assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const releaseBody = fs.readFileSync("dist/release-notes.md", "utf8");

            await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `FreshRead ${tag}`,
                body: releaseBody,
                // Keep a new release private until every verified asset exists.
                draft: true,
                prerelease: false,
              })).data;
            }

            if (
              release.body !== releaseBody ||
              release.name !== `FreshRead ${tag}` ||
              release.prerelease !== false
            ) {
              release = (await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                name: `FreshRead ${tag}`,
                body: releaseBody,
                prerelease: false,
              })).data;
            }

            const assets = [
              { file: `dist/freshread-${tag}.zip`, type: "application/zip" },
              { file: "dist/SHA256SUMS", type: "text/plain; charset=utf-8" },
              { file: "dist/release-manifest.json", type: "application/json" },
            ];
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });

            for (const asset of assets) {
              const name = path.basename(asset.file);
              for (const oldAsset of existing.filter((item) => item.name === name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: oldAsset.id,
                });
              }
              const data = fs.readFileSync(asset.file);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                headers: {
                  "content-type": asset.type,
                  "content-length": data.length,
                },
                data,
              });
            }

            if (release.draft !== false || release.prerelease !== false) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                name: `FreshRead ${tag}`,
                body: releaseBody,
                draft: false,
                prerelease: false,
              });
            }
